<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>ตรวจสอบสถานะการสมัคร</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
background:radial-gradient(circle at 75% 10%,rgba(216,255,54,.12),transparent 28%),linear-gradient(180deg,#07161c,#061015);
color:#fff;display:grid;place-items:center;padding:18px}
.card{width:min(560px,100%);background:#0c2730;border:1px solid #28515b;border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:rgba(216,255,54,.12);border:1px solid rgba(216,255,54,.3);color:#d8ff36;font-weight:800;font-size:12px}
h1{font-size:28px;line-height:1.15;margin:14px 0 8px}p{color:#b9cdc7;line-height:1.7}
.btn{display:block;text-decoration:none;text-align:center;border-radius:15px;padding:15px 16px;font-weight:900;margin-top:12px}
.primary{background:#d8ff36;color:#102016}.secondary{background:#15353e;color:#fff;border:1px solid #2c5862}
.small{font-size:12px;color:#91aaa3;margin-top:14px;line-height:1.6}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(216,255,54,.22);border-top-color:#d8ff36;animation:spin .75s linear infinite;margin:18px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <span class="badge">RUN FOR ADAMIYAH FOUNDATION</span>
  <h1>ตรวจสอบสถานะการสมัคร</h1>
  <p>กำลังเปิดหน้าตรวจสอบเลขลงทะเบียนและสถานะการชำระเงิน</p>
  <div class="spinner" id="spinner"></div>
  <a class="btn primary" id="go" href="https://script.google.com/macros/s/AKfycbwNmlkRYW7elRzx3rNa2LpBk5YUz527fdjF7Mjhnfw6acYuBMaMydkU2UXdZo3BoRV3jA/exec?page=status">เปิดหน้าตรวจสอบสถานะ</a>
  <a class="btn secondary" href="./">กลับหน้าหลัก</a>
  <div class="small">
    ระบบจะพาไปยังหน้าบริการของ Google Apps Script โดยตรงในแท็บเดียว<br>
    หากไม่เปลี่ยนหน้าอัตโนมัติ ให้แตะปุ่มด้านบนหนึ่งครั้ง
  </div>
</div>
<script>
(function(){
  const url = 'https://script.google.com/macros/s/AKfycbwNmlkRYW7elRzx3rNa2LpBk5YUz527fdjF7Mjhnfw6acYuBMaMydkU2UXdZo3BoRV3jA/exec?page=status';
  // Delay briefly so Safari/Facebook finishes opening this same-origin page first.
  setTimeout(function(){
    try {
      window.location.replace(url);
    } catch(e) {
      window.location.href = url;
    }
  }, 650);
})();
</script>
</body>
</html>
